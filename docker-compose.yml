# =========================
# EduTech — docker-compose.yml
# PostgreSQL + Adminer + App (Python)
# =========================
name: edutech

services: 
  db:
    image: postgres:${POSTGRES_VERSION:-18}   # versão do PostgreSQL, usando a 16 por padrão caso não seja passada nenhuma
    container_name: edutech_db
    ports:
      - "${PGPORT:-5433}:5432"                # expõe a porta 5433 do host → 5432 do container
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-edutech_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me}"
      POSTGRES_DB: "${POSTGRES_DB:-edutech}"
    volumes:
      - pgdata:/var/lib/postgresql/data       # dados persistentes do PostgreSQL (volume nomeado)
      - ./sql:/sql:ro                         # scripts SQL inicializam somente na PRIMEIRA subida do volume
      - ./:/import:ro                         # monta o repo no DB para o copy acessar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edutech_admin} -d ${POSTGRES_DB:-edutech} -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: edutech_adminer
    depends_on:
      db:
        condition: service_healthy          # só libera Adminer quando o DB estiver OK
    ports:
      - "${ADMINER_PORT:-8080}:8080"        # UI web do Adminer
    environment:
      ADMINER_DEFAULT_SERVER: db            # conecta ao serviço
    restart: unless-stopped

  app:
    image: python:3.12-slim
    container_name: edutech_app
    working_dir: /python
    volumes:
      - ./:/python
    depends_on:
      db:
        condition: service_healthy
    command: tail -f /dev/null

volumes:
  pgdata: